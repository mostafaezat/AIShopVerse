<div class="loading-overlay" *ngIf="show" [class.fullscreen]="fullscreen">
  <div class="loading-spinner">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">{{ resolvedMessage }}</span>
    </div>
    <p *ngIf="message" class="mt-2 mb-0 text-muted">{{ resolvedMessage }}</p>
  </div>
</div>

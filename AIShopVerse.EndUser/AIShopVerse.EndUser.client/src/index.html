<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>AIShopVerse</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="متجر AIShopVerse الإلكتروني — اكتشف منتجات مذهلة بأسعار رائعة">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Set language/direction before Angular boots to avoid a flash of the wrong direction.
    (function () {
      try {
        var saved = localStorage.getItem('preferredLanguage');
        var lang = (saved === 'en' || saved === 'ar') ? saved : 'ar';
        var html = document.documentElement;
        html.lang = lang;
        html.dir = lang === 'ar' ? 'rtl' : 'ltr';
      } catch (e) {
        document.documentElement.lang = 'ar';
        document.documentElement.dir = 'rtl';
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>

<div class="brand-list-container container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0 fw-bold">Brands</h2>
    <button class="btn btn-primary" (click)="navigateToAdd()">
      <i class="bi bi-plus-lg me-1"></i> Add Brand
    </button>
  </div>

  <app-loading [show]="loading" message="Loading brands..." [fullscreen]="false"></app-loading>

  <div *ngIf="!loading && loadError" class="alert alert-warning d-flex justify-content-between align-items-center">
    <span>Unable to load brands.</span>
    <button class="btn btn-sm btn-outline-primary" (click)="loadBrands()">
      <i class="bi bi-arrow-clockwise me-1"></i> Retry
    </button>
  </div>

  <app-empty-state *ngIf="!loading && !loadError && brands.length === 0"
    icon="bi-tag"
    title="No Brands Found"
    message="Get started by adding your first brand.">
    <button class="btn btn-primary" (click)="navigateToAdd()">
      <i class="bi bi-plus-lg me-1"></i> Add Brand
    </button>
  </app-empty-state>

  <div class="table-responsive" *ngIf="!loading && !loadError && brands.length > 0">
    <table class="table table-hover table-striped align-middle mb-0">
      <thead class="table-light">
        <tr>
          <th style="width: 60px;">Logo</th>
          <th>Name (EN)</th>
          <th>Name (AR)</th>
          <th>Description</th>
          <th style="width: 100px;">Status</th>
          <th style="width: 150px;" class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let brand of brands">
          <td>
            <div class="brand-logo-wrapper">
              <img [src]="brand.logoUrl || placeholderLogo" alt="{{ brand.nameEN }}"
                class="brand-logo" (error)="onImageError($event)">
            </div>
          </td>
          <td class="fw-medium">{{ brand.nameEN }}</td>
          <td>{{ brand.nameAR }}</td>
          <td class="text-muted" style="max-width: 250px;">
            <span class="text-truncate d-inline-block" style="max-width: 250px;">{{ brand.description || '—' }}</span>
          </td>
          <td>
            <span class="badge" [class]="brand.isActive ? 'bg-success' : 'bg-secondary'">
              {{ brand.isActive ? 'Active' : 'Inactive' }}
            </span>
          </td>
          <td class="text-end">
            <div class="btn-group btn-group-sm" role="group">
              <button class="btn btn-outline-primary" (click)="navigateToEdit(brand.id)" title="Edit">
                <i class="bi bi-pencil"></i>
              </button>
              <button class="btn btn-outline-danger" (click)="confirmDelete(brand)" title="Delete">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

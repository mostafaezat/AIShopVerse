<div class="review-list-container container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
    <h2 class="mb-0 fw-bold">Review Moderation</h2>
    <div class="d-flex gap-2">
      <select class="form-select form-select-sm" style="width: auto;" [(ngModel)]="approvedFilter" (ngModelChange)="reload()">
        <option [ngValue]="null">All</option>
        <option [ngValue]="true">Approved</option>
        <option [ngValue]="false">Pending</option>
      </select>
      <button class="btn btn-outline-secondary" (click)="reload()" [disabled]="loading">
        <i class="bi bi-arrow-clockwise me-1"></i> Refresh
      </button>
    </div>
  </div>

  <app-loading [show]="loading" message="Loading reviews..." [fullscreen]="false"></app-loading>

  <div *ngIf="!loading && loadError" class="alert alert-warning d-flex justify-content-between align-items-center">
    <span>Unable to load reviews.</span>
    <button class="btn btn-sm btn-outline-primary" (click)="reload()">
      <i class="bi bi-arrow-clockwise me-1"></i> Retry
    </button>
  </div>

  <app-empty-state *ngIf="!loading && !loadError && reviews.length === 0"
    icon="bi-chat-square-text"
    title="No Reviews Found"
    message="No reviews match the current filter.">
  </app-empty-state>

  <div class="table-responsive" *ngIf="!loading && !loadError && reviews.length > 0">
    <table class="table table-hover table-striped align-middle mb-0">
      <thead class="table-light">
        <tr>
          <th>User</th>
          <th>Product</th>
          <th>Rating</th>
          <th>Comment</th>
          <th>Status</th>
          <th>Date</th>
          <th style="width: 180px;" class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of reviews">
          <td>{{ r.userName }}</td>
          <td>{{ r.productName }}</td>
          <td>
            <span class="badge bg-warning text-dark">{{ r.rating }} / 5</span>
          </td>
          <td class="text-muted" style="max-width: 300px;">
            <span class="text-truncate d-inline-block" style="max-width: 300px;">{{ r.comment || '—' }}</span>
          </td>
          <td>
            <span class="badge" [class]="r.isApproved ? 'bg-success' : 'bg-warning text-dark'">
              {{ r.isApproved ? 'Approved' : 'Pending' }}
            </span>
          </td>
          <td class="text-nowrap">{{ r.createdAt | date:'short' }}</td>
          <td class="text-end">
            <div class="btn-group btn-group-sm" role="group">
              <button *ngIf="!r.isApproved" class="btn btn-outline-success"
                (click)="approve(r)" [disabled]="actionId === r.id" title="Approve">
                <i class="bi bi-check-lg"></i>
                <span *ngIf="actionId !== r.id">Approve</span>
                <span *ngIf="actionId === r.id" class="spinner-border spinner-border-sm"></span>
              </button>
              <button *ngIf="!r.isApproved" class="btn btn-outline-warning"
                (click)="reject(r)" [disabled]="actionId === r.id" title="Reject">
                <i class="bi bi-x-lg"></i>
                <span *ngIf="actionId !== r.id">Reject</span>
                <span *ngIf="actionId === r.id" class="spinner-border spinner-border-sm"></span>
              </button>
              <button class="btn btn-outline-danger"
                (click)="confirmDelete(r)" [disabled]="actionId === r.id" title="Delete">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="d-flex justify-content-center mt-4" *ngIf="result && result.totalPages > 1">
    <nav aria-label="Page navigation">
      <ul class="pagination pagination-sm mb-0">
        <li class="page-item" [class.disabled]="!result.hasPrevious">
          <button class="page-link" (click)="changePage(page - 1)" [disabled]="!result.hasPrevious">
            <i class="bi bi-chevron-left"></i>
          </button>
        </li>
        <li class="page-item disabled">
          <span class="page-link">{{ page }} / {{ result.totalPages }}</span>
        </li>
        <li class="page-item" [class.disabled]="!result.hasNext">
          <button class="page-link" (click)="changePage(page + 1)" [disabled]="!result.hasNext">
            <i class="bi bi-chevron-right"></i>
          </button>
        </li>
      </ul>
    </nav>
  </div>
</div>

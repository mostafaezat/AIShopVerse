<div class="category-list-container container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0 fw-bold">Categories</h2>
    <button class="btn btn-primary" (click)="navigateToAdd()">
      <i class="bi bi-plus-lg me-1"></i> Add Category
    </button>
  </div>

  <app-loading [show]="loading" message="Loading categories..." [fullscreen]="false"></app-loading>

  <div *ngIf="!loading && loadError" class="alert alert-warning d-flex justify-content-between align-items-center">
    <span>Unable to load categories.</span>
    <button class="btn btn-sm btn-outline-primary" (click)="loadCategories()">
      <i class="bi bi-arrow-clockwise me-1"></i> Retry
    </button>
  </div>

  <app-empty-state *ngIf="!loading && !loadError && categories.length === 0"
    icon="bi-collection"
    title="No Categories Found"
    message="Organize your products by creating categories.">
    <button class="btn btn-primary" (click)="navigateToAdd()">
      <i class="bi bi-plus-lg me-1"></i> Add Category
    </button>
  </app-empty-state>

  <div class="table-responsive" *ngIf="!loading && !loadError && categories.length > 0">
    <table class="table table-hover table-striped align-middle mb-0">
      <thead class="table-light">
        <tr>
          <th>Name (EN)</th>
          <th>Name (AR)</th>
          <th>Parent</th>
          <th>Description</th>
          <th style="width: 80px;">Order</th>
          <th style="width: 100px;">Status</th>
          <th style="width: 150px;" class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let cat of categories">
          <td class="fw-medium">{{ cat.nameEN }}</td>
          <td>{{ cat.nameAR }}</td>
          <td>{{ getParentName(cat.parentId) || '—' }}</td>
          <td class="text-muted" style="max-width: 250px;">
            <span class="text-truncate d-inline-block" style="max-width: 250px;">{{ cat.description || '—' }}</span>
          </td>
          <td>{{ cat.displayOrder }}</td>
          <td>
            <span class="badge" [class]="cat.isActive ? 'bg-success' : 'bg-secondary'">
              {{ cat.isActive ? 'Active' : 'Inactive' }}
            </span>
          </td>
          <td class="text-end">
            <div class="btn-group btn-group-sm" role="group">
              <button class="btn btn-outline-primary" (click)="navigateToEdit(cat.id)" title="Edit">
                <i class="bi bi-pencil"></i>
              </button>
              <button class="btn btn-outline-danger" (click)="confirmDelete(cat)" title="Delete">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

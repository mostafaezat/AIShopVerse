<div class="inventory-container container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0 fw-bold">Inventory Management</h2>
    <button class="btn btn-outline-secondary" (click)="loadProducts()" [disabled]="loading">
      <i class="bi bi-arrow-clockwise me-1"></i> Refresh
    </button>
  </div>

  <app-loading [show]="loading" message="Loading inventory..." [fullscreen]="false"></app-loading>

  <div *ngIf="!loading && loadError" class="alert alert-warning d-flex justify-content-between align-items-center">
    <span>Unable to load inventory.</span>
    <button class="btn btn-sm btn-outline-primary" (click)="loadProducts()">
      <i class="bi bi-arrow-clockwise me-1"></i> Retry
    </button>
  </div>

  <app-empty-state *ngIf="!loading && !loadError && products.length === 0"
    icon="bi-box-seam"
    title="No Products Found"
    message="There are no products in the inventory.">
  </app-empty-state>

  <div class="table-responsive" *ngIf="!loading && !loadError && products.length > 0">
    <table class="table table-hover table-striped align-middle mb-0">
      <thead class="table-light">
        <tr>
          <th>Product</th>
          <th>SKU</th>
          <th>Current Stock</th>
          <th>Adjust</th>
          <th>Reason</th>
          <th class="text-end">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of products">
          <td>
            <div class="fw-medium">{{ product.nameEN }}</div>
            <small class="text-muted">{{ product.nameAR }}</small>
          </td>
          <td><code class="text-muted">{{ product.sku }}</code></td>
          <td>
            <span class="badge"
              [class]="getStockBadgeClass(product.stockQuantity)">
              {{ product.stockQuantity }}
            </span>
          </td>
          <td>
            <input type="number"
              class="form-control form-control-sm"
              [(ngModel)]="adjustments[product.id]"
              placeholder="+/-"
              [disabled]="adjustingId === product.id"
              [min]="-1000"
              [max]="1000">
          </td>
          <td>
            <input type="text"
              class="form-control form-control-sm"
              [(ngModel)]="reasons[product.id]"
              placeholder="Reason"
              [disabled]="adjustingId === product.id"
              maxlength="100">
          </td>
          <td class="text-end">
            <button class="btn btn-sm btn-primary"
              (click)="adjustStock(product)"
              [disabled]="adjustingId === product.id || !adjustments[product.id]">
              <span *ngIf="adjustingId !== product.id">
                <i class="bi bi-plus-minus me-1"></i> Adjust
              </span>
              <span *ngIf="adjustingId === product.id" class="d-flex align-items-center gap-1">
                <span class="spinner-border spinner-border-sm" role="status"></span>
                Applying...
              </span>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
